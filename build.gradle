plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'application'
	id 'io.spring.dependency-management' version '1.1.4'
}

application {
	mainClassName='ru.sportlive.mvp.MvpApplication'
}

group = 'ru.sportlive'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
//	implementation 'org.springframework.boot:spring-boot-starter-security'
//	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.postgresql:postgresql:42.3.3'
//	implementation group: 'jakarta.persistence', name: 'jakarta.persistence-api', version: '3.1.0'
    compileOnly 'org.projectlombok:lombok'
//	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	annotationProcessor 'org.projectlombok:lombok'
//	testImplementation 'org.springframework.boot:spring-boot-starter-test'
//	testImplementation 'org.springframework.security:spring-security-test'
//	implementation 'org.postgresql:postgresql:42.3.3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:3.2.4'

	implementation 'commons-fileupload:commons-fileupload:1.4'

	implementation 'com.squareup.okhttp3:okhttp:4.9.0'

	implementation 'org.json:json:20230227'


	implementation group: 'commons-codec', name: 'commons-codec', version: '1.15'

	implementation 'io.github.cdimascio:java-dotenv:5.2.2'

	implementation 'tech.ailef:snap-admin:0.2.1'



//
//	implementation 'org.springframework.boot:spring-boot-starter-security'
//
//
//	implementation 'de.codecentric:spring-boot-admin-starter-server:3.4.1'
//
//	implementation 'de.codecentric:spring-boot-admin-starter-client:3.4.1'
//
//	implementation 'de.codecentric:spring-boot-admin-server-ui:3.4.1'


	// https://mvnrepository.com/artifact/com.vaadin/vaadin-spring-boot-starter
//	implementation 'com.vaadin:vaadin-spring-boot-starter:24.6.2'



}

tasks.named('test') {
	useJUnitPlatform()
}
