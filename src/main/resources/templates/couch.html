<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренерский интерфейс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/couch.css">
</head>
<body>

<div id="popup" class="popup"></div>


<div class="container">
    <div id="my-container">
        <h1 class="text-menu"></h1>
        <div class="d-flex justify-content-center mb-5">
            <div class="btn-group-vertical">
                <button class="btn btn-primary mb-3" id="addTraining" data-bs-toggle="modal"
                        data-bs-target="#trainingModal">Добавить тренировку
                </button>
                <button class="btn btn-primary mb-3" id="addInventory" data-bs-toggle="modal"
                        data-bs-target="#inventoryModal">Добавить инвентарь
                </button>
                <button class="btn btn-primary mb-3" id="addExercises" data-bs-toggle="modal"
                        data-bs-target="#exerciseModal">Добавить упражнения
                </button>
                <button class="btn btn-primary mb-3" id="MyTrainings" data-bs-toggle="modal"
                        data-bs-target="#scheduleForCouch">Мой тренировки
                </button>
            </div>
        </div>
    </div>

    <div class="footer d-flex justify-content-around">
        <button class="icon btn" id="stopwatchTimer" data-bs-toggle="modal" data-bs-target="#stopwatchTimerModal">⏱</button>
        <button class="icon btn" id="statistics">📊</button>
        <button class="icon btn" id="inventory">💪</button>
    </div>
</div>


<!--Информация-->

<div class="modal fade" id="inventoryScreenModal" tabindex="-1" aria-labelledby="infoScreenLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-primary">
            <div class="modal-header">
                <h5 class="modal-title" id="infoScreenLabel">Информация</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="trainer-info">Осталось тренировок тренера: <span></span></p>
                <p id="profile-info">Ваши данные: <span></span></p>
<!--                <p id="equipment-info">Общее количество инвентаря: <span></span></p>-->
                <button class="btn btn-primary mt-3" id="cashBack">Вывод средств</button>
                <button class="btn btn-primary mt-3" id="refresh-data">Обновить данные</button>
                <button type="submit" class="btn btn-danger mt-3" id="exit" onclick="exit()">Выход</button>
                <button class="btn btn-secondary mt-3" data-bs-dismiss="modal">Назад</button>
            </div>
        </div>
    </div>
</div>


<!--Вывод средств-->
<div class="modal fade" id="cashBack-modal" tabindex="-1" aria-labelledby="cashBackLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
<!--        <span class="close">&times</span>&ndash;&gt;-->
            <div class="modal-header">
                <h5 class="modal-title" id="cashBackLabel">Вывод средств</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
        <label for="amount">Введите сумму:</label>
        <input type="number" id="amount" placeholder="Сумма">
        <button id="confirm-cashBack" class="btn btn-primary" data-bs-dismiss="modal">Вывод средств</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close">Назад</button>
        </div>
    </div>
</div>


<!--Инвентори-->


<div class="modal fade" id="inventoryModalScreen" tabindex="-1" aria-labelledby="inventoryScreenLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-primary">
            <div class="modal-header">
                <h5 class="modal-title" id="inventoryScreenLabel">Инвентарь</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="margin: 20px">
                <p id="equipment-info">Общее количество инвентаря: <span></span></p>
            </div>
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close">Назад</button>
        </div>
    </div>
</div>


<!-- Добавить тренировку-->

<div class="modal fade" id="trainingModal" tabindex="-1" aria-labelledby="trainingModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trainingModalLabel">Добавить тренировку</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="profile-training">
                    <div class="mb-3">
                        <label for="sportSections">Выберите спортсекцию:</label>
                        <select id="sportSections" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label for="place" class="form-label">Место проведения:</label>
                        <input type="text" id="place" name="place" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Комментарий:</label>
                        <input type="text" id="description" name="description" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="sum" class="form-label">Цена:</label>
                        <input type="number" id="sum" name="sum" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="training_type">Выберите тип тренировки:</label>
                        <select id="training_type" class="form-select">
                            <option id="oneTraining" value="individual">Индивидуальные</option>
                            <option id="allTraining" value="general">Общие</option>
                        </select>
                    </div>


                    <!-- Блок с выбором дней недели -->
                    <div class="mb-3" id="addDaysForGeneral">
                        <label for="daysOfWeek" class="form-label">Выберите дни недели:</label>
                        <div id="daysOfWeek" class="d-flex flex-wrap">
                            <button type="button" class="day-button btn-outline-primary" data-day="1">Понедельник
                            </button>
                            <button type="button" class="day-button inactive-button" data-day="2">Вторник
                            </button>
                            <button type="button" class="day-button inactive-button" data-day="3">Среда
                            </button>
                            <button type="button" class="day-button inactive-button" data-day="4">Четверг
                            </button>
                            <button type="button" class="day-button inactive-button" data-day="5">Пятница
                            </button>
                            <button type="button" class="day-button inactive-button" data-day="6">Суббота
                            </button>
                            <button type="button" class="day-button inactive-button" data-day="0">Воскресенье
                            </button>
                        </div>

                        <!-- Блок для выбора общего временного интервала -->
                        <div class="mb-3">
                            <label for="intervalDate" class="form-label">Выберите общий временной интервал (от -
                                до):</label>
                            <div id="intervalDate" class="d-flex flex-wrap">
                                <input type="date" id="startDate" name="startDate" class="form-control" placeholder="От">
                                <input type="date" id="endDate" name="endDate" class="form-control" placeholder="До">
                            </div>
                        </div>

                        <!-- Блок для добавления времени -->
                        <div class="mb-3">
                            <label class="form-label">Добавьте время для выбранных дней:</label>
                            <div id="allTimes">
                                <!-- Здесь будет динамически добавляться время -->
                            </div>
                            <input type="button" id="nextTimes" style="margin-top: 3px" value="Добавить время" class="btn btn-outline-secondary">
                        </div>
                    </div>

                    <div class="mb-3" id="addDaysForIndividual">
                        <div id="allTime">
                            <label for="date" class="form-label">Дата:</label>
                            <input type="datetime-local" style="margin-bottom: 5px" id="date" name="date" class="form-control">
                        </div>
                        <input type="button"  style="margin-top: 3px" id="nextTime" value="Добавить время" class="btn btn-outline-secondary">

                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close">Сохранить</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close">Назад</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!--Добавить инвентарь-->

<div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="inventoryModalLabel">Добавить инвентарь</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="profile-inventory">
                    <div class="mb-3">
                        <label for="name" class="form-label">Наименование:</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Цена:</label>
                        <input type="number" id="price" name="price" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="type" class="form-label">Тип:</label>
                        <input type="text" id="type" name="type" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="size" class="form-label">Размер:</label>
                        <input type="text" id="size" name="size" class="form-control" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close">Назад</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!--//Мой тренировки-->

<div class="modal fade" id="scheduleForCouch" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scheduleModalLabel">Расписание тренировок</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="dropdown">
                    <label for="sports-section">Выберите секцию:</label>
                    <select id="sports-section" class="form-select" onchange="getSchedule()">
                        <option value="" disabled selected hidden>Спорт</option>
                    </select>
                </div>

                <p>Выберите тип тренировки</p>
                <div class="d-flex justify-content-between">
                    <button class="btn btn-outline-primary schedule-type-btn" style="width: 48%" id="individual-btn" data-type="individual">Персональные</button>
                    <button class="btn btn-outline-primary schedule-type-btn" style="width: 48%" id="general-btn" data-type="general">Общие</button>
                </div>


                <div id="calendar-container">
                    <label for="month">Выберите месяц:</label>
                    <select id="month" onchange="getSchedule()">
                        <option value="0">Январь</option>
                        <option value="1">Февраль</option>
                        <option value="2">Март</option>
                        <option value="3">Апрель</option>
                        <option value="4">Май</option>
                        <option value="5">Июнь</option>
                        <option value="6">Июль</option>
                        <option value="7">Август</option>
                        <option value="8">Сентябрь</option>
                        <option value="9">Октябрь</option>
                        <option value="10">Ноябрь</option>
                        <option value="11">Декабрь</option>
                    </select>
                </div>
                <div class="calendar" id="calendar"></div>

                <div id="allTimeForSchedule" class = "hidden">
                    <div id="times-record"></div>
                </div>

                <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close">Назад</button>
                </div>
            </div>
        </div>
    </div>
</div>


<!--// Добавить упражнения-->

<div class="modal fade" id="exerciseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exerciseModalLabel">Добавить упражнения</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="exerciseForm">
                    <div class="mb-3" id="exerciseInputs"></div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </div>
                </form>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Close">Назад</button>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Modal for Stopwatch and Timer -->
<div class="modal fade" id="stopwatchTimerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="stopwatchTimerModalLabel">Секундомер и Таймер</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Секундомер -->
                <div class="card mb-3">
                    <div class="card-header bg-secondary text-white">
                        <h6 class="mb-0">Секундомер</h6>
                    </div>
                    <div class="card-body text-center">
                        <div id="stopwatchDisplay" class="display-5 mb-3">00:00:00</div>
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-success" id="startStopwatch">Старт</button>
                            <button class="btn btn-danger" id="stopStopwatch">Стоп</button>
                            <button class="btn btn-warning" id="resetStopwatch">Сброс</button>
                        </div>
                    </div>
                </div>
                <!-- Таймер -->
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h6 class="mb-0">Таймер</h6>
                    </div>
                    <div class="card-body text-center">
                        <div id="timerDisplay" class="display-5 mb-3">00:00:00</div>
                        <div class="mb-3">
                            <input type="number" id="timerMinutes" class="form-control text-center" placeholder="Минуты" min="1">
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-success" id="startTimer">Старт</button>
                            <button class="btn btn-danger" id="stopTimer">Стоп</button>
                            <button class="btn btn-warning" id="resetTimer">Сброс</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
